name: "CodeQL cFE Build Analysis"

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQl Analysis
    uses: jphickey/cFS/.github/workflows/codeql-reusable.yml@fix-998-workflow-config
    with:
      component-path: osal-bundle
      prep: 'make native_std.prep'
      make: 'make -C build-native_std/native/default_cpu1/osal'
